name: tests
on: [push, pull_request]
jobs:
  test:
    name: Design system (tokens, axe, keyboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm run tokens

